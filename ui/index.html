<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Football Manager UI</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="bg">
      <div class="grain"></div>
      <div class="glow a"></div>
      <div class="glow b"></div>
    </div>

    <main class="app" role="application" aria-label="Football Manager">
      <header class="top">
        <div class="brand">
          <div class="mark" aria-hidden="true">FM</div>
          <div class="title">
            <div class="name">Football Manager</div>
            <div class="hint">UI върху чатбота (Phase 2–6)</div>
          </div>
        </div>

        <div class="actions">
          <button id="btnHelp" class="btn ghost" type="button">помощ</button>
          <button id="btnClear" class="btn ghost" type="button">Изчисти</button>
        </div>
      </header>

      <section class="panel">
        <div id="feed" class="feed" aria-live="polite"></div>

        <form id="composer" class="composer" autocomplete="off">
          <div class="field">
            <input
              id="command"
              name="command"
              type="text"
              placeholder="Напиши команда… (напр. Покажи всички клубове)"
              spellcheck="false"
              autofocus
            />
          </div>
          <button id="btnSend" class="btn primary" type="submit">Изпрати</button>
        </form>

        <div class="chips" aria-label="Quick commands">
          <button class="chip" data-cmd="Покажи всички клубове" type="button">Клубове</button>
          <button class="chip" data-cmd="Покажи всички играчи" type="button">Играчи</button>
          <button class="chip" data-cmd="Покажи програма Първа Лига 2024/2025" type="button">Програма</button>
          <button class="chip" data-cmd="Избери лига Първа Лига 2024/2025" type="button">Избери лига</button>
          <button class="chip" data-cmd="Покажи кръг 1 Първа Лига 2024/2025" type="button">Кръг 1</button>
        </div>
      </section>

      <footer class="foot">
        <div class="status" id="status">Свързан към локален UI сървър.</div>
        <div class="tiny">Стартирай с: <code>python src/ui_server.py</code></div>
      </footer>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
